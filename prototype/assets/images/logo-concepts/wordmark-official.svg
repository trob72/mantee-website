<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Town of Mantee text-first official logo concept</title>
  <desc id="desc">Draft logo concept using a simple M monogram and official wordmark.</desc>
  <rect width="900" height="360" fill="#f7f8f5"/>
  <circle cx="170" cy="180" r="88" fill="#17324d"/>
  <circle cx="170" cy="180" r="72" fill="none" stroke="#d4d9d0" stroke-width="8"/>
  <text x="170" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#ffffff">M</text>
  <text x="300" y="160" font-family="Arial, sans-serif" font-size="58" font-weight="800" fill="#17324d">Town of Mantee</text>
  <rect x="304" y="184" width="210" height="5" fill="#58745d"/>
  <text x="300" y="230" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="4" fill="#58745d">MISSISSIPPI</text>
  <text x="300" y="268" font-family="Arial, sans-serif" font-size="24" fill="#59636a">Official Town Website</text>
</svg>
